openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: Place, fetch and list orders. Implemented by orders-service; storefront generates its client types from this file.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://orders-service
    description: Inside the cluster
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: The order was placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listOrders
      summary: List a customer's orders, newest first
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The customer's orders. An empty array if there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Fetch one order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      responses:
        '200':
          description: The service is up.
components:
  schemas:
    NewOrder:
      type: object
      required: [customer_id, currency, amount_cents]
      properties:
        customer_id:
          type: string
          minLength: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code.
          examples: [EUR]
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          description: The amount in the currency's minor unit.
    Order:
      type: object
      required: [id, customer_id, currency, amount_cents, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        customer_id:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount_cents:
          type: integer
          format: int64
        status:
          type: string
          examples: [placed]
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Something failed on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
